[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "local-transcription"
version = "0.1.2"
description = "Local media transcription, speaker diarization, and auditable agent proofreading."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "ihoru"}]
keywords = ["transcription", "whisper", "diarization", "subtitles", "local"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "ffmpeg-binaries-compat==1.1.0",
  "faster-whisper==1.2.1",
  "ctranslate2==4.8.2",
  "sherpa-onnx==1.13.7",
  "sherpa-onnx-core==1.13.7",
  "soundfile>=0.13,<0.14",
  "numpy>=2.2,<3",
]

[project.urls]
Homepage = "https://github.com/ihoru/local-transcription"
Repository = "https://github.com/ihoru/local-transcription"
Issues = "https://github.com/ihoru/local-transcription/issues"
Documentation = "https://github.com/ihoru/local-transcription#readme"

[project.scripts]
local-transcription = "local_transcription.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.sdist]
include = ["/src/local_transcription", "/pyproject.toml", "/README.md", "/uv.lock", "/tests/*.py"]
