name: Publish to PyPI
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: pypi-publish
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Check release tag matches the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PYTHON'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag and tag != f"v{version}":
              raise SystemExit(f"Release tag {tag} does not match package version {version}")
          PYTHON
  packages:
    needs: build
    uses: ./.github/workflows/package-checks.yml
    with:
      speech: true
  publish:
    needs: packages
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/local-transcription
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: packages
      - name: Collect tested distributions
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import shutil
          output = Path("dist")
          output.mkdir()
          wheels = list(Path("packages").glob("*/*.whl"))
          assert len(wheels) == 3, wheels
          for wheel in wheels:
              shutil.copy2(wheel, output / wheel.name)
          for sdist in Path("packages/package-ubuntu-latest").glob("*.tar.gz"):
              shutil.copy2(sdist, output / sdist.name)
          PYTHON
      - uses: pypa/gh-action-pypi-publish@release/v1
